[project]
name = "syndicate"
version = "1.0.0"
description = "Multi-agent orchestrator for collaborative task execution"
requires-python = ">=3.10"
dependencies = [
    "humanize>=4.15.0",
    "langchain-openai>=1.2.1",
    "langgraph>=1.1.10",
    "loguru>=0.7.3",
    "pydantic-settings>=2.14.0",
    "streamlit>=1.57.0",
    "streamlit-local-storage>=0.0.25",
]

[project.scripts]
start = "syndicate.main:main"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"
